name: Transfer an IPA artifact to a private draft

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful public-build workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Tesla-Video-Pilot-IPA --dir transfer
      - name: Create a temporary private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          ipa="$(find transfer -maxdepth 1 -type f -name 'Tesla-Video-Pilot-Ver-*-Build-*.ipa' -print -quit)"
          test -n "$ipa"
          tag="private-transfer-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}"
          gh release create "$tag" "$ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary private transfer for run ${SOURCE_RUN_ID}" \
            --notes "Draft transfer used to move a verified Actions artifact into private release storage." \
            --draft
