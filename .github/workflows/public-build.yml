name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-iphone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Check public source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject secret-bearing files and values
        run: python3 scripts/check_public_tree.py

  web:
    name: Web and relay checks
    needs: source-safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser tests
        run: node --test ios/Web/tests/*.test.js
      - name: Check browser JavaScript
        run: node --check ios/Web/app.js
      - name: Prepare generated web resources
        run: python3 ios/scripts/prepare_web.py
      - name: Install relay dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cloudflare
      - name: Test Cloudflare relay
        run: npm test
        working-directory: cloudflare

  iphone:
    name: Build unsigned IPA
    needs: source-safety
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and validate the unsigned IPA
        run: bash ios/scripts/build_unsigned.sh
      - name: Verify IPA package
        run: python3 ios/scripts/package_ipa.py --check ios/build/MK8iPhone-unsigned.ipa
      - name: Upload short-lived build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPilot-unsigned-ipa
          path: ios/build/MK8iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.22-build24-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" ios/build/MK8iPhone-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Video Pilot 0.1.22 (build 24)" \
            --notes "Unsigned IPA for Sideloadly. Built from commit $GITHUB_SHA." \
            --latest
