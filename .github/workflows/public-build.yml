name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-iphone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-safety:
    name: Check public source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reject secret-bearing files and values
        run: python3 scripts/check_public_tree.py

  web:
    name: Web and relay checks
    needs: source-safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser tests
        run: node --test ios/Web/tests/*.test.js
      - name: Check browser JavaScript
        run: node --check ios/Web/app.js
      - name: Prepare generated web resources
        run: python3 ios/scripts/prepare_web.py
      - name: Install relay dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cloudflare
      - name: Test Cloudflare relay
        run: npm test
        working-directory: cloudflare

  iphone:
    name: Build unsigned IPA
    needs: [source-safety, web]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and validate the unsigned IPA
        run: bash ios/scripts/build_unsigned.sh
      - name: Verify IPA package
        run: |
          ipa="$(find ios/build -maxdepth 1 -type f -name 'Tesla-Video-Pilot-Ver-*-Build-*.ipa' -print -quit)"
          test -n "$ipa"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"
          python3 ios/scripts/package_ipa.py --check "$ipa"
      - name: Upload short-lived build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tesla-Video-Pilot-IPA
          path: ios/build/Tesla-Video-Pilot-Ver-*-Build-*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("ios/DISTRIBUTION.json"))["version"])')"
          build="$(python3 -c 'import json; print(json.load(open("ios/DISTRIBUTION.json"))["build"])')"
          tag="tesla-video-pilot-ver-${version}-build-${build}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tesla Video Pilot Ver ${version} Build ${build}" \
            --notes "Unsigned IPA for Sideloadly. Built from commit $GITHUB_SHA." \
            --latest
